<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kalshi Ticker Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0e13;--panel:#11161e;--panel2:#161c25;--border:#242c37;--text:#edf2f7;--muted:#8793a3;--green:#31c48d;--red:#f05252;--blue:#5aa7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:290px 1fr;height:100vh}.side{border-right:1px solid var(--border);background:#0e1218;display:flex;flex-direction:column;min-width:0}.brand{height:58px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid var(--border);font-weight:750;letter-spacing:-.02em}.brand i{width:9px;height:9px;background:var(--green);border-radius:50%;margin-right:9px}.search{padding:12px}.search input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 11px;outline:none}.markets{overflow:auto;padding:0 8px 12px}.market{padding:11px;border-radius:8px;cursor:pointer;border:1px solid transparent}.market:hover{background:var(--panel)}.market.active{background:var(--panel2);border-color:#344052}.mt{font-size:13px;font-weight:650;line-height:1.3;margin-bottom:6px}.mb{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.price{font-variant-numeric:tabular-nums;color:#d9e3ef}.main{display:grid;grid-template-rows:58px auto 1fr 30px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);background:#0e1218}.symbol{font-weight:750}.linked{font-size:12px;color:var(--muted)}.linked.ok{color:var(--green)}.head{padding:16px 18px 11px;border-bottom:1px solid var(--border);display:grid;gap:12px}.titleRow{display:flex;justify-content:space-between;gap:15px;align-items:start}.marketTitle{font-size:18px;font-weight:680;line-height:1.25}.bigPrice{text-align:right;font-size:26px;font-weight:750;font-variant-numeric:tabular-nums}.sub{font-size:12px;color:var(--muted);margin-top:4px}.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.group{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}.btn{background:transparent;border:0;color:var(--muted);padding:7px 9px;font-size:11px;cursor:pointer}.btn:hover{color:var(--text)}.btn.active{background:#253142;color:#fff}.chartWrap{position:relative;min-height:0}.chart{position:absolute;inset:0}.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0b0e1399;color:var(--muted);z-index:3}.foot{border-top:1px solid var(--border);display:flex;align-items:center;padding:0 14px;color:var(--muted);font-size:10px;gap:14px}.warn{color:#f6c85f}@media(max-width:780px){body{overflow:auto}.app{grid-template-columns:1fr;height:auto;min-height:100vh}.side{height:230px;border-right:0;border-bottom:1px solid var(--border)}.main{height:calc(100vh - 230px);min-height:500px}.brand{height:48px}.top{height:48px}.head{padding:10px 12px}.marketTitle{font-size:15px}.bigPrice{font-size:21px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><i></i>Market Ticker</div><div class="search"><input id="search" placeholder="Search markets or tickers…"></div><div id="markets" class="markets"></div></aside><main class="main"><div class="top"><div id="symbol" class="symbol">Select a market</div><div id="linked" class="linked">Checking account…</div></div><section class="head"><div class="titleRow"><div><div id="title" class="marketTitle">Kalshi price charts</div><div id="subtitle" class="sub">Choose a market to begin.</div></div><div><div id="price" class="bigPrice">—</div><div id="quote" class="sub" style="text-align:right"></div></div></div><div class="controls"><div class="group" id="types"><button class="btn active" data-type="candle">Candles</button><button class="btn" data-type="line">Line</button></div><div class="group" id="tfs"></div><button id="fit" class="btn" style="border:1px solid var(--border);border-radius:7px">Fit all</button></div></section><div class="chartWrap"><div id="chart" class="chart"></div><div id="loading" class="loading">Loading price history…</div></div><div class="foot"><span id="source">—</span><span id="range">—</span><span id="notice"></span></div></main></div>
<script>
const $=s=>document.querySelector(s);let selected=null,tf='1m',type='candle',chart,series,resizeObs,lastMarkets=[];
const times=['1s','5s','15s','30s','1m','2m','5m','10m','15m'];$('#tfs').innerHTML=times.map(x=>`<button class="btn ${x===tf?'active':''}" data-tf="${x}">${x}</button>`).join('');
function mkChart(){if(chart)chart.remove();chart=LightweightCharts.createChart($('#chart'),{layout:{background:{color:'#0b0e13'},textColor:'#8793a3'},grid:{vertLines:{color:'#151b24'},horzLines:{color:'#151b24'}},rightPriceScale:{borderColor:'#242c37'},timeScale:{borderColor:'#242c37',timeVisible:true,secondsVisible:tf.endsWith('s')},crosshair:{mode:0}});resizeObs?.disconnect();resizeObs=new ResizeObserver(e=>{const r=e[0].contentRect;chart.applyOptions({width:r.width,height:r.height})});resizeObs.observe($('#chart'));}
function renderMarkets(ms){$('#markets').innerHTML=ms.map(m=>`<div class="market ${selected===m.ticker?'active':''}" data-ticker="${m.ticker}"><div class="mt">${esc(m.title||m.ticker)}</div><div class="mb"><span>${esc(m.ticker)}</span><span class="price">${fmtPrice(m.last_price_dollars,m.last_price)}</span></div></div>`).join('');document.querySelectorAll('.market').forEach(el=>el.onclick=()=>select(el.dataset.ticker));}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function fmtPrice(d,c){let v=d!=null?Number(d)*100:(c!=null?Number(c):NaN);return Number.isFinite(v)?v.toFixed(v%1?1:0)+'¢':'—'}
async function loadMarkets(q=''){const r=await fetch('/api/markets?status=open&q='+encodeURIComponent(q));const d=await r.json();lastMarkets=d.markets||[];renderMarkets(lastMarkets)}
async function select(t){selected=t;renderMarkets(lastMarkets);await loadChart();}
async function loadChart(){if(!selected)return;$('#loading').style.display='flex';try{const r=await fetch(`/api/chart/${encodeURIComponent(selected)}?tf=${tf}`);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');const m=d.market;$('#symbol').textContent=m.ticker;$('#title').textContent=m.title||m.ticker;$('#subtitle').textContent=[m.subtitle,m.status].filter(Boolean).join(' · ');$('#price').textContent=fmtPrice(m.last_price_dollars,m.last_price);$('#quote').textContent=`YES ${fmtPrice(m.yes_bid_dollars,m.yes_bid)} / ${fmtPrice(m.yes_ask_dollars,m.yes_ask)}`;mkChart();const data=d.candles||[];if(type==='candle'){series=chart.addCandlestickSeries({priceFormat:{type:'custom',minMove:.1,formatter:p=>p.toFixed(p%1?1:0)+'¢'}});series.setData(data);}else{series=chart.addLineSeries({lineWidth:2,priceFormat:{type:'custom',minMove:.1,formatter:p=>p.toFixed(p%1?1:0)+'¢'}});series.setData(data.map(x=>({time:x.time,value:x.close})));}chart.timeScale().fitContent();$('#source').textContent='Source: '+d.source;$('#range').textContent=data.length?`${new Date(data[0].time*1000).toLocaleString()} → ${new Date(data.at(-1).time*1000).toLocaleString()}`:'No trades';$('#notice').textContent=d.truncated?'Sub-minute view is capped to recent history for performance.':'';$('#notice').className=d.truncated?'warn':'';}catch(e){$('#notice').textContent=e.message;$('#notice').className='warn';}finally{$('#loading').style.display='none';}}
$('#tfs').onclick=e=>{if(e.target.dataset.tf){tf=e.target.dataset.tf;document.querySelectorAll('[data-tf]').forEach(b=>b.classList.toggle('active',b.dataset.tf===tf));loadChart()}};$('#types').onclick=e=>{if(e.target.dataset.type){type=e.target.dataset.type;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===type));loadChart()}};$('#fit').onclick=()=>chart?.timeScale().fitContent();let timer;$('#search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>loadMarkets(e.target.value),250)};
(async()=>{try{const h=await (await fetch('/api/health')).json();$('#linked').textContent=h.linked?`Kalshi linked · ${h.env}`:'Public mode · add Kalshi credentials';$('#linked').classList.toggle('ok',h.linked)}catch{}await loadMarkets();})();
</script></body></html>
