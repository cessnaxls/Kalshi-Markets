<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kalshi Pro Terminal</title><script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><div class="brand"><span class="mark">K</span><b>Kalshi Terminal</b></div><nav><button class="nav active" data-view="trade">Trade</button><button class="nav" data-view="scanner">Scanner</button><button class="nav" data-view="bot">Automation</button></nav><div class="search"><span>⌕</span><input id="ticker" placeholder="Search ticker"><button id="load">↵</button></div><select id="period"><option value="1">1m</option><option value="60">1h</option><option value="1440">1D</option></select><span id="status" class="status"><i></i> READY</span><button id="theme" class="icon">☀︎</button></header>
<div class="app">
<aside class="markets"><div class="aside-head"><b>Markets</b><button id="scan" class="ghost">Refresh</button></div><div class="market-tabs"><button class="active">Live</button><button>Watchlist</button></div><div id="markets"></div></aside>
<section class="workspace">
<div class="instrument"><div><small id="mticker">NO MARKET</small><h1 id="title">Choose a market</h1></div><div class="quotes"><button class="yesq" id="yes">YES —</button><button class="noq" id="no">NO —</button></div></div>
<div class="chartbar"><button class="tool active">Candles</button><label><input type="checkbox" id="vwap" checked><span>VWAP</span></label><label><input type="checkbox" id="ema9" checked><span>EMA 9</span></label><label><input type="checkbox" id="ema21"><span>EMA 21</span></label><span id="indicators" class="metrics"></span></div>
<div class="chartwrap"><div class="drawbar"><button>＋</button><button>╱</button><button>⌁</button><button>Ｔ</button><button>⌖</button></div><div id="chart"></div></div>
<div class="lower"><div class="lower-tabs"><button class="active" data-lower="positions">Positions</button><button data-lower="orders">Orders</button><button data-lower="strategy">Strategy</button><button data-lower="book">Order book</button></div><div id="lowerContent"><div class="empty">No open paper positions</div></div></div>
</section>
<aside class="ticket"><div class="ticket-head"><b>Order</b><span id="modeBadge">PAPER</span></div><div class="seg mode"><button class="active" data-mode="PAPER">Paper</button><button data-mode="LIVE">Live</button></div><div class="seg side"><button class="active yes" data-side="YES">Yes</button><button class="no" data-side="NO">No</button></div><div class="type-tabs"><button class="active">Limit</button><button>Market</button></div><label class="field"><span>Limit price</span><div><span>$</span><input id="price" type="number" min=".01" max=".99" step=".01" value=".50"></div></label><label class="field"><span>Contracts</span><div><input id="count" type="number" min="1" value="1"></div></label><div class="quick"><button data-n="1">1</button><button data-n="5">5</button><button data-n="10">10</button><button data-n="25">25</button></div><div class="estimate"><span>Estimated cost</span><b id="cost">$0.50</b></div><button class="submit" id="order">Buy Yes</button><div class="account-head"><b>Paper account</b></div><div id="account"></div><details><summary>Risk controls</summary><div id="risk"><label>Max/order $<input id="maxOrder" type="number" value="5"></label><label>Daily loss $<input id="dailyLoss" type="number" value="10"></label><label>Max position<input id="maxPos" type="number" value="25"></label><button class="danger" id="kill">Kill automation</button></div></details></aside>
</div>
<div id="automation" class="drawer hidden"><div class="drawer-head"><div><small>AUTOMATION</small><h2>Strategy engine</h2></div><button id="closeDrawer">×</button></div><textarea id="strategy">price <= 0.25 && price > vwap && ema9 > ema21 && spread <= 0.05 && volumeRatio >= 1.25</textarea><div class="row"><button id="testRule">Test rule</button><label><input id="bot" type="checkbox"> Scanner enabled</label><label><input id="auto" type="checkbox"> Auto-trade</label><select id="botMode"><option>PAPER</option><option>LIVE</option></select></div><div id="signals"></div></div>
<script src="/app.js"></script></body></html>
