<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Kalshi Ticker Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--vh:1vh;--bg:#090c11;--panel:#0f141b;--panel2:#151c25;--border:#25303d;--text:#edf3f8;--muted:#8a99aa;--green:#20c77a;--red:#f05359;--blue:#59a8ff;--amber:#f2c45a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}button,input{font:inherit}.app{position:fixed;inset:0;height:calc(var(--vh)*100);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-rows:48px 54px minmax(0,1fr) 24px;background:var(--bg)}
.top{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);background:#0d1218}.search{display:flex;min-width:0;gap:6px}.search input{min-width:0;flex:1;height:34px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:0 10px;outline:none;font-size:13px}.go,.tiny{height:34px;border:1px solid var(--border);background:#202b39;color:#fff;border-radius:7px;padding:0 12px;font-weight:700;cursor:pointer}.status{font-size:11px;color:var(--muted);white-space:nowrap}.status.ok{color:var(--green)}
.marketbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);background:#0b1016}.symbol{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.quote{text-align:right}.last{font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.bidask{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap}
.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 260px}.chartPane{min-width:0;min-height:0;display:grid;grid-template-rows:38px minmax(0,1fr) auto;border-right:1px solid var(--border)}.controls{display:flex;align-items:center;gap:5px;padding:4px 7px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}.controls::-webkit-scrollbar{display:none}.group{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex:0 0 auto}.btn{border:0;background:transparent;color:var(--muted);height:28px;padding:0 8px;font-size:10px;cursor:pointer;white-space:nowrap}.btn.active{background:#243244;color:#fff}.sideToggle .btn.active.yes{background:#173c2e;color:#9ff0ca}.sideToggle .btn.active.no{background:#3a2023;color:#ffc0c3}.fit{border:1px solid var(--border);border-radius:6px}.liveDot{font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}.liveDot.ok{color:var(--green)}.chartWrap{position:relative;min-height:0}.chart{position:absolute;inset:0}.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#090c11aa;color:var(--muted);z-index:3;font-size:12px}
.paper{min-height:0;background:#0c1117;display:grid;grid-template-rows:36px auto auto minmax(0,1fr);overflow:hidden}.paperHead{display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-bottom:1px solid var(--border);font-size:12px;font-weight:800}.paperHead small{font-size:9px;color:var(--amber);font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border)}.metric{padding:7px 8px;border-right:1px solid var(--border);min-width:0}.metric:last-child{border-right:0}.metric b{display:block;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric span{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}.ticket{padding:7px;border-bottom:1px solid var(--border)}.row{display:flex;gap:5px;align-items:center}.qty{width:64px;height:30px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:#fff;padding:0 7px}.tradeBtn{flex:1;height:30px;border:0;border-radius:6px;font-size:10px;font-weight:800;color:#fff;cursor:pointer}.buy{background:#167a50}.sell{background:#963a3e}.hint{font-size:8px;color:var(--muted);margin-top:5px;line-height:1.25}.positions{min-height:0;overflow:auto}.posTitle{position:sticky;top:0;background:#0c1117;padding:6px 8px;font-size:9px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border)}.pos{display:grid;grid-template-columns:1fr auto;gap:6px;padding:7px 8px;border-bottom:1px solid #18212b;font-size:10px}.pos b{display:block}.pos small{color:var(--muted)}
.foot{display:flex;align-items:center;gap:10px;padding:0 8px;border-top:1px solid var(--border);font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden}.warn{color:var(--amber)}
@media(max-width:900px){.app{grid-template-rows:44px 48px minmax(0,1fr) 22px}.workspace{grid-template-columns:minmax(0,1fr) 220px}.chartPane{grid-template-rows:34px minmax(0,1fr) auto}.controls{padding:3px 5px}.btn{height:26px;padding:0 6px;font-size:9px}.last{font-size:18px}.paper{grid-template-rows:32px auto auto minmax(0,1fr)}.paperHead{font-size:11px}.metric{padding:5px}.metric b{font-size:10px}.ticket{padding:5px}.tradeBtn,.qty{height:28px}.pos{padding:5px 7px}.status{font-size:9px}.top{padding:5px 7px}.marketbar{padding:5px 7px}}
@media(max-width:760px){.workspace{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 178px}.chartPane{border-right:0;border-bottom:1px solid var(--border)}.paper{grid-template-columns:150px 1fr;grid-template-rows:31px 49px minmax(0,1fr);grid-template-areas:"head head" "metrics ticket" "positions positions"}.paperHead{grid-area:head}.metrics{grid-area:metrics}.ticket{grid-area:ticket;border-left:1px solid var(--border)}.positions{grid-area:positions}.posTitle{display:none}.positions{display:flex;overflow-x:auto}.pos{min-width:150px;border-right:1px solid #18212b}.top{grid-template-columns:1fr auto}.status{max-width:130px;overflow:hidden;text-overflow:ellipsis}.marketbar{grid-template-columns:minmax(0,1fr) auto}.title{max-width:58vw}.hint{display:none}}
@media(max-width:520px){.status{display:none}.workspace{grid-template-rows:minmax(0,1fr) 164px}.paper{grid-template-columns:120px 1fr}.metric{padding:4px}.metric b{font-size:9px}.metric span{font-size:7px}.tradeBtn{font-size:9px}.bidask{font-size:8px}.symbol{font-size:10px}.title{font-size:9px}.last{font-size:16px}}

.taMenu{position:absolute;top:36px;left:8px;z-index:20;width:235px;background:#111820;border:1px solid var(--border);border-radius:8px;padding:8px;box-shadow:0 12px 30px #0009;display:none}.taMenu.open{display:block}.taMenu h4{font-size:9px;color:var(--muted);text-transform:uppercase;margin:4px 2px 6px}.checkrow{display:grid;grid-template-columns:1fr 1fr;gap:4px}.checkrow label{font-size:9px;padding:6px;border:1px solid #202a35;border-radius:5px;display:flex;gap:5px;align-items:center}.chartPane{position:relative}.indicatorPane{height:0;min-height:0;overflow:hidden;border-top:0 solid var(--border);background:#090c11;transition:height .12s}.indicatorPane.open{height:126px;border-top-width:1px}.indicatorChart{width:100%;height:100%}.orderType{height:28px;background:var(--panel2);color:#fff;border:1px solid var(--border);border-radius:6px;font-size:9px;padding:0 5px}.priceInput{width:55px;height:28px;background:var(--panel2);color:#fff;border:1px solid var(--border);border-radius:6px;font-size:9px;padding:0 5px}.advanced{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:5px}.advanced label{font-size:7px;color:var(--muted)}.advanced input{width:100%;height:24px;margin-top:2px;background:var(--panel2);color:#fff;border:1px solid var(--border);border-radius:5px;padding:0 4px;font-size:8px}.orders{border-top:1px solid var(--border)}.order{display:grid;grid-template-columns:1fr auto;gap:6px;padding:5px 8px;border-bottom:1px solid #18212b;font-size:9px}.cancel{border:1px solid var(--border);background:#1a232d;color:#ddd;border-radius:5px;font-size:8px}.badge{font-size:8px;padding:2px 5px;border:1px solid var(--border);border-radius:10px;color:var(--muted)}
@media(max-width:760px){.indicatorPane.open{height:92px}.taMenu{top:32px;width:210px}.advanced{display:none}.paper{grid-template-rows:31px 49px minmax(0,1fr)}.ticket{overflow:auto}.orders{display:none}}
</style></head><body><div class="app">
<header class="top"><div class="search"><input id="search" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="Enter Kalshi ticker"><button id="go" class="go">Go</button></div><div id="linked" class="status">Checking Kalshi…</div></header>
<section class="marketbar"><div><div id="symbol" class="symbol">No market selected</div><div id="title" class="title">Type a Kalshi ticker above.</div></div><div class="quote"><div id="price" class="last">—</div><div id="quote" class="bidask">YES — / — · NO — / —</div></div></section>
<div class="workspace"><section class="chartPane"><div class="controls"><div class="group" id="types"><button class="btn active" data-type="candle">Candles</button><button class="btn" data-type="line">Line</button></div><div class="group sideToggle" id="sides"><button class="btn active yes" data-side="yes">YES</button><button class="btn no" data-side="no">NO</button></div><div class="group" id="tfs"></div><button id="taBtn" class="btn fit">TA</button><button id="hlineBtn" class="btn fit">H-Line</button><button id="alertBtn" class="btn fit">Alert</button><button id="fit" class="btn fit">Fit</button><span id="live" class="liveDot">LIVE off</span></div><div id="taMenu" class="taMenu"><h4>Overlays</h4><div class="checkrow"><label><input type="checkbox" data-ta="sma9"> SMA 9</label><label><input type="checkbox" data-ta="sma20"> SMA 20</label><label><input type="checkbox" data-ta="ema9"> EMA 9</label><label><input type="checkbox" data-ta="ema21"> EMA 21</label><label><input type="checkbox" data-ta="bb20"> Bollinger 20</label><label><input type="checkbox" data-ta="vwap"> VWAP</label></div><h4>Lower indicator</h4><div class="group"><button class="btn active" data-lower="none">None</button><button class="btn" data-lower="rsi">RSI</button><button class="btn" data-lower="macd">MACD</button></div></div><div class="chartWrap"><div id="chart" class="chart"></div><div id="loading" class="loading">Loading market…</div></div><div id="indicatorPane" class="indicatorPane"><div id="indicatorChart" class="indicatorChart"></div></div></section>
<aside class="paper"><div class="paperHead"><span>Paper Trade</span><small>FAKE MONEY</small></div><div class="metrics"><div class="metric"><b id="cash">$10,000</b><span>Cash</span></div><div class="metric"><b id="equity">$10,000</b><span>Equity</span></div><div class="metric"><b id="pnl">$0</b><span>24H P/L</span></div></div><div class="ticket"><div class="row"><select id="orderType" class="orderType"><option value="market">Market</option><option value="limit">Limit</option><option value="stop">Stop</option></select><input id="orderPx" class="priceInput" type="number" min="1" max="99" step="0.1" placeholder="¢"><input id="qty" class="qty" type="number" inputmode="numeric" min="1" step="1" value="10"><button id="buy" class="tradeBtn buy">BUY YES</button><button id="sell" class="tradeBtn sell">SELL YES</button></div><div class="advanced"><label>Take profit ¢<input id="tpPx" type="number" min="1" max="99" step="0.1" placeholder="optional"></label><label>Stop loss ¢<input id="slPx" type="number" min="1" max="99" step="0.1" placeholder="optional"></label><label>Risk %<input id="riskPct" type="number" min="0.1" max="100" step="0.1" placeholder="size helper"></label></div><div id="fillHint" class="hint">Paper only. Market fills at ask/bid; limit/stop wait for price.</div></div><div class="positions"><div class="posTitle">Positions & Orders</div><div id="positions"></div><div id="orders" class="orders"></div></div></aside></div>
<footer class="foot"><span id="source">—</span><span id="range">—</span><span id="notice"></span><button id="resetPaper" class="btn" style="margin-left:auto;height:18px">Reset paper</button></footer>
</div><script>
const $=s=>document.querySelector(s);let selected=null,tf='1m',type='candle',side='yes',chart,series,resizeObs,eventSource,lastMarket=null,lastCandle=null,liveQuote={yesBid:null,yesAsk:null,last:null};let rawCandles=[],taSeries=[],indicatorChart=null,indicatorResize=null,lowerIndicator='none',drawMode=null,priceAlerts=[];
const times=['1s','5s','15s','30s','1m','2m','5m','10m','15m'];$('#tfs').innerHTML=times.map(x=>`<button class="btn ${x===tf?'active':''}" data-tf="${x}">${x}</button>`).join('');
const stepOf=x=>({"1s":1,"5s":5,"15s":15,"30s":30,"1m":60,"2m":120,"5m":300,"10m":600,"15m":900}[x]||60);
function setVH(){document.documentElement.style.setProperty('--vh',`${(window.visualViewport?.height||window.innerHeight)*.01}px`)}setVH();window.visualViewport?.addEventListener('resize',setVH);window.addEventListener('orientationchange',()=>setTimeout(setVH,100));
function cents(v){v=Number(v);return Number.isFinite(v)?`${v.toFixed(v%1?1:0)}¢`:'—'}function dollars(v){return '$'+Number(v||0).toFixed(2)}
function marketCents(d,c){let v=d!=null?Number(d)*100:(c!=null?Number(c):NaN);return Number.isFinite(v)?v:null}
function noFromYes(p){return Number.isFinite(p)?100-p:null}function shownPrice(p){return side==='yes'?p:noFromYes(p)}
function shownCandle(c){if(side==='yes')return c;return {time:c.time,open:100-c.open,high:100-c.low,low:100-c.high,close:100-c.close,volume:c.volume}}
function mkChart(){if(chart)chart.remove();chart=LightweightCharts.createChart($('#chart'),{layout:{background:{color:'#090c11'},textColor:'#8492a2'},grid:{vertLines:{color:'#141b24'},horzLines:{color:'#141b24'}},rightPriceScale:{borderColor:'#25303d',scaleMargins:{top:.08,bottom:.08}},timeScale:{borderColor:'#25303d',timeVisible:true,secondsVisible:stepOf(tf)<60,rightOffset:2},crosshair:{mode:0},handleScroll:{vertTouchDrag:false}});resizeObs?.disconnect();resizeObs=new ResizeObserver(e=>{const r=e[0].contentRect;chart.applyOptions({width:Math.max(1,r.width),height:Math.max(1,r.height)})});resizeObs.observe($('#chart'));makeSeries()}
function makeSeries(){if(!chart)return;taSeries=[];if(series)try{chart.removeSeries(series)}catch{};const fmt={type:'custom',minMove:.1,formatter:p=>cents(p)};if(type==='candle')series=chart.addCandlestickSeries({priceFormat:fmt,upColor:'#20c77a',downColor:'#f05359',wickUpColor:'#20c77a',wickDownColor:'#f05359',borderVisible:false});else series=chart.addLineSeries({lineWidth:2,priceFormat:fmt,color:'#59a8ff'});}
function setChartData(data){makeSeries();const transformed=data.map(shownCandle);lastCandle=transformed.at(-1)||null;if(type==='candle')series.setData(transformed);else series.setData(transformed.map(x=>({time:x.time,value:x.close})));}
function renderQuote(){const yb=liveQuote.yesBid,ya=liveQuote.yesAsk,nb=Number.isFinite(ya)?100-ya:null,na=Number.isFinite(yb)?100-yb:null;$('#quote').textContent=`YES ${cents(yb)} / ${cents(ya)} · NO ${cents(nb)} / ${cents(na)}`;const p=shownPrice(liveQuote.last);$('#price').textContent=cents(p);$('#buy').textContent='BUY '+side.toUpperCase();$('#sell').textContent='SELL '+side.toUpperCase();$('#fillHint').textContent=`${side.toUpperCase()} · buy ${cents(side==='yes'?ya:na)} · sell ${cents(side==='yes'?yb:nb)} · simulated only`;renderPaper()}
async function openTicker(){const t=$('#search').value.trim().toUpperCase();if(!t)return;selected=t;$('#notice').textContent='Opening '+t+'…';await loadChart()}
async function loadChart(){if(!selected)return;$('#loading').style.display='flex';closeLive();try{const r=await fetch(`/api/chart/${encodeURIComponent(selected)}?tf=${tf}`);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');lastMarket=d.market;selected=lastMarket.ticker;$('#search').value=selected;$('#symbol').textContent=selected;$('#title').textContent=lastMarket.title||selected;liveQuote.yesBid=marketCents(lastMarket.yes_bid_dollars,lastMarket.yes_bid);liveQuote.yesAsk=marketCents(lastMarket.yes_ask_dollars,lastMarket.yes_ask);liveQuote.last=marketCents(lastMarket.last_price_dollars,lastMarket.last_price);mkChart();chart.subscribeClick(param=>{if(drawMode==='hline'){const p=currentCrosshairPrice(param);if(Number.isFinite(p)){addHorizontalAt(p);drawMode=null;$('#notice').textContent=`Horizontal line at ${cents(p)}`}}});setChartData(d.candles||[]);chart.timeScale().fitContent();renderQuote();$('#source').textContent='History: '+d.source;const data=d.candles||[];$('#range').textContent=data.length?`${new Date(data[0].time*1000).toLocaleString()} → live`:'No historical trades';$('#notice').textContent=d.truncated?'Fine intervals show recent history; live updates continue from here.':'';$('#notice').className=d.truncated?'warn':'';openLive()}catch(e){$('#notice').textContent=e.message;$('#notice').className='warn';$('#live').textContent='LIVE error';}finally{$('#loading').style.display='none'}}
function parseTrade(m){const raw=Number(m.yes_price_dollars ?? m.price_dollars ?? (m.yes_price!=null?Number(m.yes_price)/100:NaN));const p=Number.isFinite(raw)?raw*100:null;let ts=m.ts??m.timestamp??m.created_time??Date.now()/1000;if(typeof ts==='string')ts=new Date(ts).getTime()/1000;ts=Number(ts);if(ts>1e12)ts/=1000;return {price:p,time:Math.floor(ts)}}
function updateLiveTrade(m){const t=parseTrade(m);if(!Number.isFinite(t.price)||!Number.isFinite(t.time))return;liveQuote.last=t.price;const p=shownPrice(t.price),step=stepOf(tf),bucket=Math.floor(t.time/step)*step,newBucket=!lastCandle||lastCandle.time!==bucket;if(newBucket){const prev=lastCandle?.close??p;lastCandle={time:bucket,open:prev,high:Math.max(prev,p),low:Math.min(prev,p),close:p,volume:0}}else{lastCandle.high=Math.max(lastCandle.high,p);lastCandle.low=Math.min(lastCandle.low,p);lastCandle.close=p}if(type==='candle')series?.update(lastCandle);else series?.update({time:bucket,value:p});const yesC=side==='yes'?lastCandle:{time:lastCandle.time,open:100-lastCandle.open,high:100-lastCandle.low,low:100-lastCandle.high,close:100-lastCandle.close,volume:lastCandle.volume};if(side==='yes'){const i=rawCandles.findIndex(x=>x.time===bucket);if(i>=0)rawCandles[i]={...rawCandles[i],open:yesC.open,high:yesC.high,low:yesC.low,close:yesC.close};else rawCandles.push({...yesC})}else{const back={time:yesC.time,open:100-yesC.open,high:100-yesC.low,low:100-yesC.high,close:100-yesC.close,volume:yesC.volume};const i=rawCandles.findIndex(x=>x.time===bucket);if(i>=0)rawCandles[i]={...rawCandles[i],...back};else rawCandles.push(back)}if(newBucket){renderTA();renderLower()}renderQuote();checkPaperOrders();checkPriceAlerts()}
function updateTicker(m){const cv=x=>{const n=Number(x);return Number.isFinite(n)?n*100:null};let b=cv(m.yes_bid_dollars),a=cv(m.yes_ask_dollars),l=cv(m.last_price_dollars);if(b==null&&m.yes_bid!=null)b=Number(m.yes_bid);if(a==null&&m.yes_ask!=null)a=Number(m.yes_ask);if(l==null&&m.price!=null)l=Number(m.price);if(Number.isFinite(b))liveQuote.yesBid=b;if(Number.isFinite(a))liveQuote.yesAsk=a;if(Number.isFinite(l))liveQuote.last=l;renderQuote();checkPaperOrders();checkPriceAlerts()}
function closeLive(){eventSource?.close();eventSource=null;$('#live').textContent='LIVE connecting';$('#live').className='liveDot'}
function openLive(){eventSource=new EventSource('/api/live/'+encodeURIComponent(selected));eventSource.addEventListener('status',e=>{const s=JSON.parse(e.data);$('#live').textContent=s.status==='connected'?'● LIVE':s.status==='reconnecting'?'LIVE reconnecting':'LIVE '+s.status;$('#live').className='liveDot '+(s.status==='connected'?'ok':'');if(s.message)$('#notice').textContent=s.message});eventSource.addEventListener('trade',e=>updateLiveTrade(JSON.parse(e.data)));eventSource.addEventListener('ticker',e=>updateTicker(JSON.parse(e.data)));eventSource.onerror=()=>{$('#live').textContent='LIVE reconnecting';$('#live').className='liveDot'}}

function sma(data,n){const out=[];let sum=0;for(let i=0;i<data.length;i++){sum+=data[i].close;if(i>=n)sum-=data[i-n].close;if(i>=n-1)out.push({time:data[i].time,value:sum/n})}return out}
function ema(data,n){const out=[];if(!data.length)return out;const k=2/(n+1);let e=data[0].close;for(let i=0;i<data.length;i++){e=i?data[i].close*k+e*(1-k):e;out.push({time:data[i].time,value:e})}return out}
function stdBands(data,n=20){const mid=sma(data,n),map=new Map(mid.map(x=>[x.time,x.value])),upper=[],lower=[];for(let i=n-1;i<data.length;i++){const a=data.slice(i-n+1,i+1).map(x=>x.close),m=map.get(data[i].time),sd=Math.sqrt(a.reduce((z,v)=>z+(v-m)**2,0)/n);upper.push({time:data[i].time,value:m+2*sd});lower.push({time:data[i].time,value:m-2*sd})}return {mid,upper,lower}}
function vwapData(data){let pv=0,v=0;return data.map(x=>{const vol=Math.max(Number(x.volume)||1,1),typ=(x.high+x.low+x.close)/3;pv+=typ*vol;v+=vol;return {time:x.time,value:pv/v}})}
function addOverlay(points,opts={}){const s=chart.addLineSeries({lineWidth:opts.width||1,lineStyle:opts.style||0,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,priceFormat:{type:'custom',minMove:.1,formatter:p=>cents(p)}});s.setData(points);taSeries.push(s);return s}
function renderTA(){if(!chart||!rawCandles.length)return;for(const s of taSeries)try{chart.removeSeries(s)}catch{};taSeries=[];const d=rawCandles.map(shownCandle),on=k=>document.querySelector(`[data-ta="${k}"]`)?.checked;if(on('sma9'))addOverlay(sma(d,9),{width:2});if(on('sma20'))addOverlay(sma(d,20),{width:2});if(on('ema9'))addOverlay(ema(d,9),{width:2});if(on('ema21'))addOverlay(ema(d,21),{width:2});if(on('bb20')){const b=stdBands(d,20);addOverlay(b.mid);addOverlay(b.upper,{style:2});addOverlay(b.lower,{style:2})}if(on('vwap'))addOverlay(vwapData(d),{width:2})}
function rsiData(data,n=14){const out=[];if(data.length<n+1)return out;let g=0,l=0;for(let i=1;i<=n;i++){const d=data[i].close-data[i-1].close;g+=Math.max(0,d);l+=Math.max(0,-d)}g/=n;l/=n;for(let i=n;i<data.length;i++){if(i>n){const d=data[i].close-data[i-1].close;g=(g*(n-1)+Math.max(0,d))/n;l=(l*(n-1)+Math.max(0,-d))/n}const rs=l===0?100:g/l;out.push({time:data[i].time,value:100-100/(1+rs)})}return out}
function macdData(data){const a=ema(data,12),b=ema(data,26),bm=new Map(b.map(x=>[x.time,x.value]));return a.filter(x=>bm.has(x.time)).map(x=>({time:x.time,value:x.value-bm.get(x.time)}))}
function renderLower(){const pane=$('#indicatorPane');if(lowerIndicator==='none'||!rawCandles.length){pane.classList.remove('open');indicatorChart?.remove();indicatorChart=null;return}pane.classList.add('open');indicatorChart?.remove();indicatorChart=LightweightCharts.createChart($('#indicatorChart'),{layout:{background:{color:'#090c11'},textColor:'#738293'},grid:{vertLines:{color:'#141b24'},horzLines:{color:'#141b24'}},rightPriceScale:{borderColor:'#25303d'},timeScale:{visible:false},crosshair:{mode:0}});const d=rawCandles.map(shownCandle);if(lowerIndicator==='rsi'){const s=indicatorChart.addLineSeries({lineWidth:1,priceLineVisible:false,lastValueVisible:true});s.setData(rsiData(d));s.createPriceLine({price:70,color:'#666',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'70'});s.createPriceLine({price:30,color:'#666',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'30'});}else{const s=indicatorChart.addHistogramSeries({priceLineVisible:false,lastValueVisible:true});s.setData(macdData(d).map(x=>({time:x.time,value:x.value})))}indicatorResize?.disconnect();indicatorResize=new ResizeObserver(e=>{const r=e[0].contentRect;indicatorChart?.applyOptions({width:r.width,height:r.height})});indicatorResize.observe($('#indicatorChart'));chart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)indicatorChart?.timeScale().setVisibleLogicalRange(r)});indicatorChart.timeScale().fitContent()}
function addHorizontalAt(price,label='S/R'){if(!series||!Number.isFinite(price))return;series.createPriceLine({price,color:'#f2c45a',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:label})}
function currentCrosshairPrice(param){if(!param?.point||!series)return null;try{return series.coordinateToPrice(param.point.y)}catch{return null}}
function checkPriceAlerts(){if(!selected)return;const p=shownPrice(liveQuote.last);if(!Number.isFinite(p))return;for(const a of priceAlerts.filter(x=>!x.fired&&x.ticker===selected&&x.side===side)){if((a.dir==='above'&&p>=a.price)||(a.dir==='below'&&p<=a.price)){a.fired=true;alert(`${selected} ${side.toUpperCase()} crossed ${a.price.toFixed(1)}¢ (${a.dir}).`);}}}
$('#taBtn').onclick=()=>$('#taMenu').classList.toggle('open');$('#taMenu').onchange=e=>{if(e.target.dataset.ta)renderTA()};$('#taMenu').onclick=e=>{if(e.target.dataset.lower){lowerIndicator=e.target.dataset.lower;document.querySelectorAll('[data-lower]').forEach(b=>b.classList.toggle('active',b.dataset.lower===lowerIndicator));renderLower()}};
$('#hlineBtn').onclick=()=>{drawMode='hline';$('#notice').textContent='Tap chart to place a horizontal support/resistance line.'};$('#alertBtn').onclick=()=>{const v=prompt(`Alert when ${side.toUpperCase()} price crosses what level (¢)?`,shownPrice(liveQuote.last)?.toFixed(1)||'50');const price=Number(v);if(!Number.isFinite(price))return;const dir=price>shownPrice(liveQuote.last)?'above':'below';priceAlerts.push({ticker:selected,side,price,dir,fired:false});addHorizontalAt(price,'ALERT');$('#notice').textContent=`Alert set ${dir} ${cents(price)}`};
$('#orders').onclick=e=>{const id=e.target.dataset.cancel;if(!id)return;const p=getPaper();p.orders=(p.orders||[]).filter(o=>o.id!==id);savePaper(p);renderPaper()};
$('#riskPct').onchange=()=>{const pct=Number($('#riskPct').value),stop=Number($('#slPx').value),entry=sideBidAsk().ask;if(!Number.isFinite(pct)||!Number.isFinite(stop)||!Number.isFinite(entry)||stop>=entry)return;const p=getPaper(),riskDollars=p.cash*pct/100,riskPer=(entry-stop)/100;$('#qty').value=Math.max(1,Math.floor(riskDollars/riskPer))};

$('#go').onclick=openTicker;$('#search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();openTicker()}};$('#tfs').onclick=e=>{if(e.target.dataset.tf){tf=e.target.dataset.tf;document.querySelectorAll('[data-tf]').forEach(b=>b.classList.toggle('active',b.dataset.tf===tf));loadChart()}};$('#types').onclick=e=>{if(e.target.dataset.type){type=e.target.dataset.type;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===type));loadChart()}};$('#sides').onclick=e=>{if(e.target.dataset.side){side=e.target.dataset.side;document.querySelectorAll('[data-side]').forEach(b=>b.classList.toggle('active',b.dataset.side===side));loadChart();renderQuote()}};$('#fit').onclick=()=>chart?.timeScale().fitContent();
const PAPER_KEY='kalshi-paper-v3';
function defaultPaper(){return {start:10000,cash:10000,positions:{},trades:[],settlements:[],orders:[]}}
function getPaper(){try{const p=JSON.parse(localStorage.getItem(PAPER_KEY))||defaultPaper();p.positions=p.positions||{};p.trades=p.trades||[];p.settlements=p.settlements||[];p.orders=p.orders||[];if(!Number.isFinite(Number(p.cash)))p.cash=10000;if(!Number.isFinite(Number(p.start)))p.start=10000;return p}catch{return defaultPaper()}}
function savePaper(p){localStorage.setItem(PAPER_KEY,JSON.stringify(p))}
function posKey(t,s){return `${t}|${s}`}
function sideBidAsk(){const yb=liveQuote.yesBid,ya=liveQuote.yesAsk;return side==='yes'?{bid:yb,ask:ya}:{bid:noFromYes(ya),ask:noFromYes(yb)}}
function paperTrade(action){if(!selected)return alert('Open a market first.');const qty=Math.max(1,Math.floor(Number($('#qty').value)||1)),q=sideBidAsk(),kind=$('#orderType').value,trigger=Number($('#orderPx').value),tp=Number($('#tpPx')?.value),sl=Number($('#slPx')?.value);if(kind!=='market'&&!Number.isFinite(trigger))return alert('Enter a limit/stop price in cents.');if(kind==='market'){const px=action==='buy'?q.ask:q.bid;if(!Number.isFinite(px))return alert('No live bid/ask available yet.');executePaperFill({ticker:selected,side,action,qty,px,tp,sl,source:'market'});return}const p=getPaper();p.orders.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),time:Date.now(),ticker:selected,side,action,qty,type:kind,trigger,tp:Number.isFinite(tp)?tp:null,sl:Number.isFinite(sl)?sl:null});savePaper(p);renderPaper();checkPaperOrders()}
function executePaperFill(o){const p=getPaper(),k=posKey(o.ticker,o.side),pos=p.positions[k]||{ticker:o.ticker,side:o.side,qty:0,avg:0,tp:null,sl:null};if(o.action==='buy'){const cost=o.qty*o.px/100;if(cost>p.cash+1e-9)return false;pos.avg=(pos.avg*pos.qty+o.px*o.qty)/(pos.qty+o.qty);pos.qty+=o.qty;p.cash-=cost;if(Number.isFinite(o.tp))pos.tp=o.tp;if(Number.isFinite(o.sl))pos.sl=o.sl}else{if(o.qty>pos.qty)return false;pos.qty-=o.qty;p.cash+=o.qty*o.px/100;if(pos.qty===0){pos.avg=0;pos.tp=null;pos.sl=null}}p.positions[k]=pos;p.trades.unshift({time:Date.now(),ticker:o.ticker,side:o.side,action:o.action,qty:o.qty,px:o.px,source:o.source||'order'});p.trades=p.trades.slice(0,200);savePaper(p);renderPaper();return true}
function quoteFor(s){const yb=liveQuote.yesBid,ya=liveQuote.yesAsk;return s==='yes'?{bid:yb,ask:ya,last:liveQuote.last}:{bid:noFromYes(ya),ask:noFromYes(yb),last:noFromYes(liveQuote.last)}}
function checkPaperOrders(){const p=getPaper();let changed=false;for(const o of [...p.orders]){if(o.ticker!==selected)continue;const q=quoteFor(o.side),market=o.action==='buy'?q.ask:q.bid,ref=Number.isFinite(q.last)?q.last:market;if(!Number.isFinite(ref))continue;let hit=o.type==='limit'?(o.action==='buy'?market<=o.trigger:market>=o.trigger):(o.action==='buy'?ref>=o.trigger:ref<=o.trigger);if(hit&&Number.isFinite(market)){if(executePaperFill({...o,px:market,source:o.type})){p.orders=p.orders.filter(x=>x.id!==o.id);changed=true}}}if(changed){const latest=getPaper();latest.orders=p.orders;savePaper(latest);renderPaper()}checkBrackets()}
function checkBrackets(){const p=getPaper();let changed=false;for(const [k,pos] of Object.entries(p.positions)){if(pos.qty<=0||pos.ticker!==selected)continue;const q=quoteFor(pos.side),mark=q.bid??q.last;if(!Number.isFinite(mark))continue;let why=null;if(Number.isFinite(pos.tp)&&mark>=pos.tp)why='take-profit';if(Number.isFinite(pos.sl)&&mark<=pos.sl)why='stop-loss';if(why&&Number.isFinite(q.bid)){executePaperFill({ticker:pos.ticker,side:pos.side,action:'sell',qty:pos.qty,px:q.bid,source:why});changed=true}}if(changed)renderPaper()}
function markFor(s){const yb=liveQuote.yesBid,ya=liveQuote.yesAsk;if(s==='yes')return Number.isFinite(yb)?yb:(liveQuote.last??0);const nb=noFromYes(ya);return Number.isFinite(nb)?nb:noFromYes(liveQuote.last)??0}
function pnl24h(p){const cutoff=Date.now()-86400000;return (p.settlements||[]).filter(x=>Number(x.time)>=cutoff).reduce((sum,x)=>sum+Number(x.pnl||0),0)}
function renderPaper(){const p=getPaper();let value=0;for(const x of Object.values(p.positions))if(x.qty>0)value+=x.qty*markFor(x.side)/100;const eq=p.cash+value,pnl=pnl24h(p);$('#cash').textContent=dollars(p.cash);$('#equity').textContent=dollars(eq);$('#pnl').textContent=(pnl>=0?'+':'')+dollars(pnl);$('#pnl').style.color=pnl>0?'var(--green)':pnl<0?'var(--red)':'';const open=Object.values(p.positions).filter(x=>x.qty>0);$('#positions').innerHTML=open.length?open.map(x=>{const mark=markFor(x.side),u=(mark-x.avg)*x.qty/100;return `<div class="pos"><div><b>${x.side.toUpperCase()} ${x.qty}</b><small>${x.ticker}<br>avg ${cents(x.avg)} · mark ${cents(mark)}${Number.isFinite(x.tp)?` · TP ${cents(x.tp)}`:''}${Number.isFinite(x.sl)?` · SL ${cents(x.sl)}`:''}</small></div><b style="color:${u>=0?'var(--green)':'var(--red)'}">${u>=0?'+':''}${dollars(u)}</b></div>`}).join(''):'<div class="pos"><small>No open paper positions.</small><span></span></div>';$('#orders').innerHTML=(p.orders||[]).length?'<div class="posTitle">Pending Orders</div>'+p.orders.map(o=>`<div class="order"><span><b>${o.action.toUpperCase()} ${o.qty} ${o.side.toUpperCase()}</b> <span class="badge">${o.type} ${cents(o.trigger)}</span><br><small>${o.ticker}</small></span><button class="cancel" data-cancel="${o.id}">Cancel</button></div>`).join(''):''}
let settlementCheckBusy=false;
async function checkPaperSettlements(){if(settlementCheckBusy)return;settlementCheckBusy=true;try{const p=getPaper();const tickers=[...new Set(Object.values(p.positions).filter(x=>x.qty>0).map(x=>x.ticker))];let changed=false;for(const ticker of tickers){let d;try{const r=await fetch('/api/market/'+encodeURIComponent(ticker),{cache:'no-store'});d=await r.json();if(!r.ok)continue}catch{continue}const m=d.market||d;const result=String(m.result||'').toLowerCase();const finalized=String(m.status||'').toLowerCase()==='finalized'||Boolean(m.settlement_ts);if(!finalized||!['yes','no'].includes(result))continue;const settleTime=m.settlement_ts?new Date(m.settlement_ts).getTime():Date.now();for(const s of ['yes','no']){const k=posKey(ticker,s),pos=p.positions[k];if(!pos||pos.qty<=0)continue;const payoutCents=s===result?100:0;const payout=pos.qty*payoutCents/100;const costBasis=pos.qty*pos.avg/100;const realized=payout-costBasis;p.cash+=payout;p.settlements.unshift({id:`${ticker}|${s}|${settleTime}`,time:settleTime,ticker,side:s,result,qty:pos.qty,avg:pos.avg,payout,pnl:realized});delete p.positions[k];changed=true;$('#notice').textContent=`Paper settled ${ticker}: ${s.toUpperCase()} ${pos.qty} · ${realized>=0?'+':''}${dollars(realized)} realized`;$('#notice').className=realized>=0?'':'warn'} }
if(changed){p.settlements=p.settlements.slice(0,500);savePaper(p);renderPaper()}}finally{settlementCheckBusy=false}}
$('#buy').onclick=()=>paperTrade('buy');$('#sell').onclick=()=>paperTrade('sell');$('#resetPaper').onclick=()=>{if(confirm('Reset paper account to $10,000?')){savePaper(defaultPaper());renderPaper()}};
(async()=>{renderPaper();checkPaperSettlements();setInterval(checkPaperSettlements,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkPaperSettlements()});try{const h=await (await fetch('/api/health')).json();$('#linked').textContent=h.linked?`Kalshi linked · ${h.env}`:'Add Kalshi API key for live feed';$('#linked').className='status '+(h.linked?'ok':'')}catch{$('#linked').textContent='Backend unavailable'}})();
</script></body></html>
