<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kalshi Edge Terminal</title><script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script><link rel="stylesheet" href="/style.css"></head><body>
<header><button id="browse">☰</button><b class="brand">EDGE</b><input id="ticker" placeholder="Market ticker"><button id="go">Go</button><span id="conn">●</span><button id="theme">☾</button></header>
<div class="marketbar"><div><b id="mticker">NO MARKET</b><span id="title">Choose a Kalshi market</span></div><div class="quote"><b id="last">—</b><span id="quotes">YES — / — · NO — / —</span></div></div>
<main><section class="center"><nav class="toolbar"><div class="seg"><button class="ctype active" data-v="candles">Candles</button><button class="ctype" data-v="line">Line</button></div><div class="seg"><button class="contract active" data-v="YES">YES</button><button class="contract" data-v="NO">NO</button></div><div id="tfs" class="seg"><button class="active" data-v="1m">1m</button><button data-v="5m">5m</button><button data-v="10m">10m</button><button data-v="15m">15m</button><button data-v="1h">1h</button><button data-v="1d">1d</button></div><button id="fit">Fit</button><label><input id="vwap" type="checkbox"> VWAP</label><label><input id="ema9" type="checkbox"> EMA9</label><label><input id="ema21" type="checkbox"> EMA21</label><span id="live">● IDLE</span></nav><div class="chartwrap"><div id="chart"></div><div id="ohlc">O — H — L — C —</div><div id="chartmsg">Load a market</div></div><div class="bottomtabs"><button class="tab active" data-tab="positions">Positions</button><button class="tab" data-tab="bot">Bot</button><button class="tab" data-tab="journal">Journal</button><span id="status">Ready</span></div><div id="bottompanel" class="bottompanel"></div></section>
<aside><div class="asidehead"><b>Order Ticket</b><div class="mode"><button class="modebtn active" data-mode="paper">PAPER</button><button class="modebtn" data-mode="live">LIVE</button></div></div><div id="acct" class="stats"></div><div class="seg side"><button class="sidebtn active" data-v="YES">YES</button><button class="sidebtn" data-v="NO">NO</button></div><div class="ticket"><div class="row"><label>Contracts<input id="count" type="number" value="1" min="1"></label><label>Limit ¢<input id="limit" type="number" value="50" min="1" max="99"></label></div><div class="actions"><button id="buy" class="buy">BUY YES</button><button id="sell" class="sell">SELL YES</button></div><small id="hint">Load a market</small></div><div class="riskline"><span>BOT</span><b id="botbadge">OFF</b><button id="kill">KILL</button></div><div class="section">POSITIONS</div><div id="sidepos" class="sidepos"></div></aside></main>
<div id="drawer" class="drawer hidden"><div class="dhead"><b>Markets</b><button id="close">×</button></div><input id="filter" placeholder="Filter ticker or title"><div id="markets"></div></div>
<script src="/app.js"></script></body></html>
