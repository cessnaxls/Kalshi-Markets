<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kalshi Edge Terminal</title><script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script><link rel="stylesheet" href="/style.css"></head><body>
<header><b>EDGE//KALSHI</b><input id="ticker" placeholder="Market ticker"><button id="load">LOAD</button><select id="period"><option value="1">1m</option><option value="60">1h</option><option value="1440">1D</option></select><span id="status">READY</span><button id="theme">☀︎</button></header>
<main><section class="left panel"><h3>Markets</h3><div class="filters"><button data-filter="open">LIVE</button><button id="scan">SCAN EDGE</button></div><div id="markets"></div></section>
<section class="center"><div class="quote"><div><small id="mticker">NO MARKET</small><h2 id="title">Enter a Kalshi ticker</h2></div><div><b id="yes">YES —</b><b id="no">NO —</b></div></div><div class="toolbar"><label><input type="checkbox" id="vwap" checked> VWAP</label><label><input type="checkbox" id="ema9" checked> EMA9</label><label><input type="checkbox" id="ema21"> EMA21</label><label><input type="checkbox" id="bb"> Bollinger</label><span id="indicators"></span></div><div id="chart"></div><div class="bottom panel"><h3>Bot / Scanner</h3><textarea id="strategy">price <= 0.25 && price > vwap && ema9 > ema21 && spread <= 0.05 && volumeRatio >= 1.25</textarea><div class="row"><button id="testRule">TEST RULE</button><label><input id="bot" type="checkbox"> BOT ENABLED</label><label><input id="auto" type="checkbox"> AUTO-TRADE</label><select id="botMode"><option>PAPER</option><option>LIVE</option></select></div><div id="signals"></div></div></section>
<aside class="right panel"><div class="tabs"><button class="active">TRADE</button></div><label>Mode<select id="mode"><option>PAPER</option><option>LIVE</option></select></label><label>Side<select id="side"><option>YES</option><option>NO</option></select></label><label>Action<select id="action"><option>BUY</option><option>SELL</option></select></label><label>Limit price<input id="price" type="number" min=".01" max=".99" step=".01" value=".50"></label><label>Contracts<input id="count" type="number" min="1" value="1"></label><button class="primary" id="order">PLACE PAPER ORDER</button><div id="risk"><h3>Risk Controls</h3><label>Max/order $<input id="maxOrder" type="number" value="5"></label><label>Daily loss $<input id="dailyLoss" type="number" value="10"></label><label>Max position<input id="maxPos" type="number" value="25"></label><button class="danger" id="kill">KILL BOT</button></div><h3>Paper Account</h3><div id="account"></div><h3>Order Book</h3><div id="book"></div></aside></main><script src="/app.js"></script></body></html>
