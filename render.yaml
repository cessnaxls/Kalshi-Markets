services:
  - type: web
    name: kalshi-edge-terminal
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: KALSHI_ENV
        value: demo
      - key: KALSHI_API_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY
        sync: false
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: DATA_DIR
        value: /var/data
    disk:
      name: terminal-data
      mountPath: /var/data
      sizeGB: 1
