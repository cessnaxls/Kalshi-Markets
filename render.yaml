services:
  - type: web
    name: kalshi-edge-terminal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: KALSHI_ENV
        value: demo
      - key: KALSHI_API_KEY_ID
        sync: false
      - key: KALSHI_PRIVATE_KEY
        sync: false
      - key: LIVE_TRADING_ENABLED
        value: "false"
